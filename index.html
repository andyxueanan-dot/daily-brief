<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="strict-origin-when-cross-origin"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>每日信息站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a quiet phone newspaper. Section tabs, a date strip, one-line headline rows grouped by topic; tapping a row opens a full-width detail page with its own back button. */
:root{
  --bg:#ffffff; --fg:#1a1d1b; --muted:#5f6a64; --faint:#8b948f; --line:#e2e7e4;
  --accent:#17803d; --soft:#f2f6f3; --amber:#94600a; --slate:#4b5d6b;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-head:"Noto Serif SC","Source Serif 4","Songti SC","STSong",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121413; --fg:#e9ece9; --muted:#a4ada8; --faint:#7b847f; --line:#2a2f2c;
  --accent:#55c47f; --soft:#1a201c; --amber:#e0a649; --slate:#9db2c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --fg:#e9ece9; --muted:#a4ada8; --faint:#7b847f; --line:#2a2f2c;
  --accent:#55c47f; --soft:#1a201c; --amber:#e0a649; --slate:#9db2c2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.en{font-family:var(--f-en)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-family:var(--f-head);font-weight:700;font-size:19px;color:var(--faint);padding:4px 0}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tools{display:flex;gap:14px;flex:none;font-size:15px;color:var(--muted)}
.tools button[aria-pressed="true"]{color:var(--accent);font-weight:500}
.stamp{color:var(--muted);font-size:13px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.stamp b{font-weight:500;color:var(--amber)}
.days{display:flex;gap:22px;overflow-x:auto;margin:10px 0 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;font-size:15px;color:var(--muted);padding:6px 0 9px;border-bottom:3px solid transparent;white-space:nowrap}
.days button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

h1{font-family:var(--f-head);font-weight:900;font-size:clamp(28px,8vw,38px);line-height:1.22;margin:26px 0 6px;text-wrap:balance}
.counts{color:var(--muted);font-size:15px;margin:0}
.note{color:var(--muted);font-size:14px;margin:10px 0 0;max-width:40em}
.night{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:4px;text-decoration:none;color:var(--fg)}
.night span{color:var(--muted);font-size:14px}

.label{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.label b{font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:500}
.sub{margin:18px 0 0;font-size:13px;color:var(--faint);letter-spacing:.08em}
.list{list-style:none;margin:0;padding:0}

/* one-line news rows */
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);min-height:52px}
.nrow .t{font-family:var(--f-en);font-weight:600;font-size:17px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nrow .m{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.nrow.seen .t{color:var(--muted);font-weight:400}
.dotk{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dotk.direct{background:var(--accent)} .dotk.potential{background:var(--amber)} .dotk.background{background:var(--slate)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--faint);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* reading rows */
.rrow{display:block;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.rrow h3{font-family:var(--f-en);font-weight:600;font-size:19px;line-height:1.35;margin:2px 0 4px;text-wrap:balance}
.rrow p{margin:0;color:var(--muted);font-size:15px}
.meta{font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:0 8px}
.meta span+span::before{content:"·";margin-right:8px}

/* videos */
.vid{border-bottom:1px solid var(--line);padding:14px 0}
.vhead{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;width:100%;text-align:left;align-items:start}
.vthumb{position:relative;width:132px;aspect-ratio:16/9;max-width:100%;border-radius:4px;background:var(--soft);overflow:hidden;display:block}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:11px;line-height:1;padding:3px 4px;border-radius:2px;background:#000c;color:#fff;font-variant-numeric:tabular-nums}
.vhead h3{font-family:var(--f-en);font-weight:600;font-size:16px;line-height:1.35;margin:0 0 3px}
.vhead p{margin:0;font-size:13px;color:var(--muted)}
.vbody{margin-top:10px;font-size:15px}
.vbody p{margin:0 0 8px}
.vbody .k{color:var(--faint);font-size:12px;letter-spacing:.06em;display:block}
.more{display:block;width:100%;padding:14px 0;color:var(--accent);font-weight:500;text-align:left;border-bottom:1px solid var(--line)}
.flag{font-size:12px;color:var(--amber)}

/* detail page */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--muted);font-size:15px;padding:6px 0}
.dmeta{margin-top:14px;font-size:13px;color:var(--faint)}
.dtitle{font-family:var(--f-en);font-weight:700;font-size:clamp(25px,7vw,32px);line-height:1.25;margin:6px 0 10px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap}
.chip.direct{color:var(--accent);border-color:currentColor} .chip.potential{color:var(--amber);border-color:currentColor} .chip.background{color:var(--slate);border-color:currentColor}
.prose{font-family:var(--f-en);font-size:18px;line-height:1.65;max-width:36em}
.prose p{margin:0 0 14px}
.blk{margin-top:26px}
.blk h2{font-family:var(--f-head);font-size:17px;font-weight:700;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk p{margin:0 0 8px}
.blk ol,.blk ul{margin:0 0 8px;padding-left:1.3em}
.blk li{margin-bottom:4px}
.lim{color:var(--muted);font-size:14px}
.out{font-size:15px}
.out b{font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--faint)} .kv dd{margin:0}
details.term{border-bottom:1px solid var(--line);padding:8px 0}
details.term summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
details.term summary::-webkit-details-marker{display:none}
details.term summary b{font-family:var(--f-en)}
details.term summary span{color:var(--muted);font-size:14px}
details.term p{margin:6px 0 0;font-size:14px}
.srcs{list-style:none;padding:0;margin:0}
.srcs li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.srcs q{display:block;margin-top:4px;font-family:var(--f-en);font-style:italic;color:var(--muted);font-size:15px}
.srcs q::before,.srcs q::after{content:none}

/* Claude panel */
.ask{margin-top:26px;padding:14px;border:1px solid var(--line);border-radius:4px}
.ask h2{margin:0 0 4px}
.ask .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qtabs button{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.qtabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:500}
.ask textarea{width:100%;min-height:150px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:10px;-webkit-user-select:text;user-select:text}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);font-weight:500;text-decoration:none;font-size:15px}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;margin:10px 0 0;background:#000;border-radius:4px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gate input[type=password]{width:100%;min-height:46px;font:inherit;font-size:16px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 12px;margin:4px 0 10px}
.gate-keep{display:flex;gap:8px;align-items:center}
.copied{font-size:13px;color:var(--accent);min-height:1.4em;margin:6px 0 0}
.direct-note{font-size:12px;color:var(--faint);margin:6px 0 0}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.acts .btn[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.undo{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:4px;font-size:14px}
.undo button{color:var(--accent);font-weight:500}

details.fold{margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
details.fold>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.legacy{font-size:15px}
.legacy h3{font-family:var(--f-head);font-size:18px;margin:16px 0 4px;line-height:1.4}
.legacy .mine{background:var(--soft);padding:8px 10px;border-radius:3px;font-size:14px;margin:8px 0}
.legacy .tbl{overflow-x:auto}
.legacy table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
.legacy th,.legacy td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.legacy .src,.lsrc{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.tl time{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums}
.tl .est{color:var(--faint);font-size:12px}

/* ielts */
.ielts .q{font-family:var(--f-en);font-size:18px;line-height:1.6;padding:12px 14px;background:var(--soft);border-radius:4px;margin:8px 0 0}
.ielts h3{font-family:var(--f-head);font-size:16px;margin:22px 0 6px}
.ielts .model p{font-family:var(--f-en);font-size:17px;line-height:1.65;margin:0 0 12px}
.ielts .pair{margin:0 0 14px}
.ielts .pair b{display:block;font-family:var(--f-en);font-weight:600}
.ielts .pair p{margin:2px 0 0;font-family:var(--f-en);font-size:16px}
.chart{overflow-x:auto}
.chart table{border-collapse:collapse;min-width:360px;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.chart th,.chart td{border-bottom:1px solid var(--line);padding:6px;text-align:left}

.data textarea{width:100%;min-height:120px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px}
.data dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:8px 0}
.data dt{color:var(--faint)} .data dd{margin:0}
.ok{color:var(--accent)} .warn{color:var(--amber)}
.end{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px}
.end p{margin:0 0 4px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media (max-width:400px){.vhead{grid-template-columns:112px minmax(0,1fr)}.vthumb{width:112px}.tabs{gap:15px}.tabs button{font-size:18px}}
</style>

<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist" aria-label="栏目" id="tabs">
      <button role="tab" data-view="brief" aria-selected="true">晨报</button>
      <button role="tab" data-view="video" aria-selected="false">视频</button>
      <button role="tab" data-view="tonight" aria-selected="false">睡前</button>
      <button role="tab" data-view="ielts" aria-selected="false">IELTS</button>
      <button role="tab" data-view="grad" aria-selected="false">留学</button>
    </div>
    <div class="tools">
      <button type="button" id="btn-saved" aria-pressed="false">收藏</button>
      <button type="button" id="btn-data" aria-pressed="false">数据</button>
    </div>
  </div>
  <p class="stamp" id="stamp"></p>
  <div class="days" id="days" role="tablist" aria-label="日期"></div>
  <main id="view"><p class="empty">正在载入……</p></main>

<script>
function startApp(DATA){
"use strict";
DATA = DATA || {days:{}, order:[]};
document.querySelector(".top").hidden = false;
var SITE = DATA.site === true;
var ORDER = DATA.order || [];
var KEEP_DAYS = 30;

/* ---------- time helpers (UTC+8) ---------- */
function nowUtc8(){ var d = new Date(); return new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000); }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function isNight(){ var h = nowUtc8().getHours(); return h >= 20 || h < 5; }
function dayDiff(a, b){ return Math.round((Date.parse(a+"T00:00:00Z") - Date.parse(b+"T00:00:00Z")) / 86400000); }
var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function dayTab(id){ var d = new Date(id+"T00:00:00Z"); return WEEK[d.getUTCDay()] + " " + d.getUTCDate() + "日"; }
function dayHead(id){ var d = new Date(id+"T00:00:00Z"); return (d.getUTCMonth()+1) + "月" + d.getUTCDate() + "日 " + "星期" + "日一二三四五六".charAt(d.getUTCDay()); }

/* ---------- state: localStorage + optional db sync ---------- */
var LS = "andy-brief-v3", LS_OLD = "andy-brief-v2";
var S = {stars:{}, hidden:{}, learned:{}, seen:{}, updated:0};
var sync = {mode:"local", msg:"仅本机浏览器保存"};
function readLS(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e) { return null; } }
function writeLS(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
(function load(){
  var s = readLS(LS);
  if (s) { ["stars","hidden","learned","seen"].forEach(function(k){ if (s[k]) S[k] = s[k]; }); S.updated = s.updated || 0; }
  var old = readLS(LS_OLD);
  if (old && !s) {
    var map = DATA.legacy_key_map || {};
    var t = Date.now();
    Object.keys(old.stars || {}).forEach(function(id){ if (old.stars[id] && map[id]) S.stars[map[id]] = {v:true, t:t}; });
    Object.keys(old.seen || {}).forEach(function(id){ if (map[id]) S.seen[map[id]] = {v:true, t:t}; });
  }
})();
function on(kind, key){ var r = S[kind][key]; return !!(r && r.v); }
function setFlag(kind, key, v){ S[kind][key] = {v:!!v, t:Date.now()}; S.updated = Date.now(); writeLS(); pushRemote(); }
function prune(){
  var today = ymd(nowUtc8()), n = 0;
  ["stars","hidden","learned","seen"].forEach(function(k){
    Object.keys(S[k]).forEach(function(key){ var d = key.slice(0,10); if (/^\d{4}-\d\d-\d\d$/.test(d) && dayDiff(today, d) > KEEP_DAYS) { delete S[k][key]; n++; } });
  });
  if (n) { writeLS(); }
  return n;
}
var PRUNED = prune();
function merge(remote){
  ["stars","hidden","learned","seen"].forEach(function(k){
    var r = remote[k] || {};
    Object.keys(r).forEach(function(key){ var a = S[k][key]; if (!a || (r[key] && r[key].t > a.t)) S[k][key] = r[key]; });
  });
}
var dbDoc = null, pushTimer = null;
function pushRemote(){
  if (!dbDoc) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){
    dbDoc.set({stars:S.stars, hidden:S.hidden, learned:S.learned, seen:S.seen, updated:S.updated}).then(function(){
      sync = {mode:"db", msg:"已同步到云端（" + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}) + "）"};
      if (VIEW === "data") render();
    }).catch(function(e){ sync = {mode:"local", msg:"云端写入失败（" + (e && e.code || "未知") + "），本机已保存"}; if (VIEW === "data") render(); });
  }, 800);
}
function startSync(){
  if (!window.claude || !window.claude.use) { sync = {mode:"local", msg:"当前环境没有云端存储，仅本机保存"}; return; }
  var timer = setTimeout(function(){ if (!dbDoc) { sync = {mode:"local", msg:"云端存储无响应，仅本机保存"}; if (VIEW === "data") render(); } }, 10000);
  window.claude.use("db").then(function(db){
    if (!db) { clearTimeout(timer); sync = {mode:"local", msg:"未登录或未授权云端存储，仅本机保存"}; if (VIEW === "data") render(); return; }
    var ref = db.doc("prefs/state");
    return ref.get().then(function(snap){
      clearTimeout(timer);
      dbDoc = ref;
      if (snap.exists) { merge(snap.data() || {}); prune(); writeLS(); render(); }
      sync = {mode:"db", msg:"云端已连接，登录同一账号的设备会同步"};
      pushRemote();
    });
  }).catch(function(e){ clearTimeout(timer); sync = {mode:"local", msg:"云端读取失败（" + (e && e.code || "未知") + "），仅本机保存"}; if (VIEW === "data") render(); });
}

/* ---------- videos ---------- */
function vScore(v, hiddenSeries, catW){ return (catW[v.category] || 0) - (hiddenSeries[v.series_key] ? 99 : 0); }
function videoList(day){
  var d = DATA.days[day] || {}, all = d.videos || [], target = d.video_target || 10;
  var kept = all.filter(function(v){ return !on("hidden", key(day, v.id)); });
  // feedback weights from the last 30 days
  var catW = {}, hiddenSeries = {};
  ORDER.forEach(function(dd){
    var D = DATA.days[dd] || {};
    (D.videos || []).concat(D.video_backups || []).forEach(function(v){
      var k = key(dd, v.id);
      if (on("stars", k)) catW[v.category] = (catW[v.category] || 0) + 1;
      if (on("hidden", k)) { catW[v.category] = (catW[v.category] || 0) - 2; if (v.series_key) hiddenSeries[v.series_key] = 1; }
    });
  });
  // no upper limit: show every kept video; feedback only reorders (liked categories up, hidden categories/series down)
  var ranked = kept.map(function(v, i){ return {v:v, i:i, s:vScore(v, hiddenSeries, catW)}; })
    .sort(function(a, b){ return (b.s - a.s) || (a.i - b.i); }).map(function(x){ return x.v; });
  return {shown: ranked, hiddenCount: all.length - kept.length, backfilled: 0, target: target};
}

var OPENV = {}, PLAY = {};
function videoBlock(day, vl, full){
  var shown = vl.shown, n = full || SHOW_ALL_VIDEOS ? shown.length : Math.min(3, shown.length);
  var h = '';
  if (LAST_HIDDEN && LAST_HIDDEN.day === day && LAST_HIDDEN.kind === "video") h += '<div class="undo"><span>已隐藏 1 个视频' + (vl.backfilled ? '，已用备用补位' : '') + '</span><button type="button" data-undo="1">撤销</button></div>';
  h += '<ul class="list">' + shown.slice(0, n).map(function(v){ return videoItem(day, v, OPENV[day + v.id]); }).join("") + '</ul>';
  if (n < shown.length) h += '<button class="more" type="button" data-allv="1">共 ' + shown.length + ' 条，展开其余 ' + (shown.length - n) + ' 条</button>';
  if (shown.length < vl.target) h += '<p class="note warn">今天实际 ' + shown.length + ' 个，少于最低目标 ' + vl.target + ' 个：' + esc((DATA.days[day] || {}).video_shortfall || "合格候选不够，没有用低质量内容凑数。") + '</p>';
  return h;
}
function renderVideo(){

function vocabList(list){ return (list || []).map(function(v){ return '<details class="term"><summary><b>' + esc(v.phrase) + '</b><span>' + esc(v.meaning) + '</span></summary><p class="en">' + esc(v.example) + '</p><p>' + esc(v.zh) + '</p></details>'; }).join(""); }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.view === VIEW ? "true" : "false"); if (b.dataset.view === "grad") b.hidden = SITE; });

  renderDays();
  var v = document.getElementById("view"), h;
  if (DETAIL && DETAIL.type === "news") h = renderNewsDetail(DETAIL.day, DETAIL.id);
  else if (DETAIL && DETAIL.type === "reading") h = renderReadingDetail(DETAIL.day, DETAIL.id);
  else if (VIEW === "video") h = renderVideo();
  else if (VIEW === "tonight") h = renderTonight();
  else if (VIEW === "ielts") h = renderIelts();
  else if (VIEW === "grad") h = renderGrad();
  else if (VIEW === "saved") h = renderSaved();
  else if (VIEW === "data") h = renderData();
  else h = renderBrief();
  v.innerHTML = h;
}

/* ---------- copy ---------- */
function copyText(text, box, msgEl, okMsg){
  function fallback(){
    var done = false;
    if (box) {
      box.removeAttribute("readonly"); box.focus(); box.select(); try { box.setSelectionRange(0, text.length); } catch(e) {}
      try { done = document.execCommand && document.execCommand("copy"); } catch(e) { done = false; }
      box.setAttribute("readonly","");
    }
    if (msgEl) msgEl.textContent = done ? okMsg : "自动复制不可用：文字已选中，请长按或按 Ctrl+C 复制。";
    return !!done;
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function(){ if (msgEl) msgEl.textContent = okMsg; return true; }, fallback);
    }
  } catch(e) {}
  return Promise.resolve(fallback());
}

/* ---------- events ---------- */
var scrollMemo = 0;
document.addEventListener("click", function(e){
  var t = e.target.closest("button, a[data-go], a[data-copy]");
  if (!t) return;
  var ds = t.dataset;
  if (ds.view) { setView(ds.view); return; }
  if (ds.go) { e.preventDefault(); setView(ds.go); return; }
  if (t.id === "btn-saved") { setView(VIEW === "saved" ? "brief" : "saved"); return; }
  if (t.id === "btn-data") { setView(VIEW === "data" ? "brief" : "data"); return; }
  if (ds.day) { DAY = ds.day; LAST_HIDDEN = null; SHOW_ALL_VIDEOS = false; render(); return; }
  if (ds.news) { var dd = ds.dayOpen || DAY; scrollMemo = window.scrollY; DETAIL = {type:"news", day:dd, id:ds.news}; if (!on("seen", key(dd, ds.news))) setFlag("seen", key(dd, ds.news), true); render(); window.scrollTo(0,0); return; }
  if (ds.reading) { var dr = ds.dayOpen || DAY; scrollMemo = window.scrollY; DETAIL = {type:"reading", day:dr, id:ds.reading}; render(); window.scrollTo(0,0); return; }
  if (ds.back) { DETAIL = null; render(); window.scrollTo(0, scrollMemo); return; }
  if (ds.star) { setFlag("stars", ds.star, !on("stars", ds.star)); render(); return; }
  if (ds.learn) { setFlag("learned", ds.learn, !on("learned", ds.learn)); render(); return; }
  if (ds.hideNews) { var day = DETAIL ? DETAIL.day : DAY; setFlag("hidden", key(day, ds.hideNews), true); LAST_HIDDEN = {day:day, kind:"news", k:key(day, ds.hideNews)}; DETAIL = null; DAY = day; render(); window.scrollTo(0, scrollMemo); return; }
  if (ds.hideVid) { setFlag("hidden", key(DAY, ds.hideVid), true); LAST_HIDDEN = {day:DAY, kind:"video", k:key(DAY, ds.hideVid)}; render(); return; }
  if (ds.undo) { if (LAST_HIDDEN) setFlag("hidden", LAST_HIDDEN.k, false); LAST_HIDDEN = null; render(); return; }
  if (ds.vid) { OPENV[DAY + ds.vid] = !OPENV[DAY + ds.vid]; if (VIEW === "tonight") OPENV[today() + ds.vid] = true; render(); return; }
  if (ds.play) { var pd = VIEW === "tonight" ? today() : DAY; PLAY[pd + ds.play] = true; var yy = window.scrollY; render(); window.scrollTo(0, yy); return; }
  if (ds.allv) { SHOW_ALL_VIDEOS = true; render(); return; }
  if (ds.q !== undefined && DETAIL) { QSEL[DETAIL.id] = +ds.q; var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (ds.copy || ds.copyonly) {
    // copy inside the tap itself; the link (if any) opens Claude natively, so nothing waits on the clipboard
    var box = document.getElementById("prompt-box"), msg = document.getElementById("copied");
    copyText(box.value, box, msg, ds.copy ? "已复制。在 Claude 里粘贴，检查后再发送。" : "已复制。").then(function(ok){
      if (!ok && ds.copy && msg) msg.textContent = "自动复制没成功：回到这页，提示词已选中，长按复制后再粘贴到 Claude。";
    });
    return;
  }
  if (ds.reload) { location.reload(); return; }
  if (ds["export"]) { var eb = document.getElementById("export-box"); eb.value = JSON.stringify({app:"andy-brief", v:3, exported_at:new Date().toISOString(), stars:S.stars, hidden:S.hidden, learned:S.learned, seen:S.seen}); copyText(eb.value, eb, document.getElementById("exp-msg"), "已复制导出文本。"); return; }
  if (ds["import"]) {
    var im = document.getElementById("imp-msg");
    try { var o = JSON.parse(document.getElementById("import-box").value); if (o.app !== "andy-brief") throw 0; merge(o); prune(); S.updated = Date.now(); writeLS(); pushRemote(); im.textContent = "已导入并合并。"; }
    catch(err) { im.textContent = "无法识别：请粘贴从「生成并复制导出文本」得到的完整内容。"; }
    return;
  }
});
render();
startSync();
}
/* ---------- boot: plain data (Artifact) or encrypted data (website) ---------- */
(function(){
  var obj;
  try { obj = JSON.parse(document.getElementById("brief-data").textContent); } catch(e) { obj = {days:{}, order:[]}; }
  if (!obj || !obj.enc) { startApp(obj); return; }
  var view = document.getElementById("view"), LSK = "brief-key-" + obj.salt;
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function decryptWith(key){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(obj.iv)}, key, b64(obj.ct)).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function importRaw(raw){ return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, true, ["decrypt"]); }
  function derive(pass){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(obj.salt), iterations:obj.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
    });
  }
  function showGate(msg){
    document.querySelector(".top").hidden = true;
    document.getElementById("days").hidden = true;
    document.getElementById("stamp").textContent = "";
    view.innerHTML = '<form id="gate" class="gate"><h1>输入口令</h1><p class="note">内容已加密。口令保存在你电脑的口令文件里；在这台设备上输入一次即可。</p>' +
      '<label class="lim" for="gate-pass">口令</label><input id="gate-pass" type="password" autocomplete="current-password" required>' +
      '<label class="lim gate-keep"><input id="gate-keep" type="checkbox" checked> 在这台设备上记住</label>' +
      '<div class="btns"><button class="btn primary" type="submit">解锁</button></div><p class="copied" id="gate-msg" aria-live="polite">' + (msg || "") + '</p></form>';
    document.getElementById("gate").addEventListener("submit", function(e){
      e.preventDefault();
      var pass = document.getElementById("gate-pass").value, keep = document.getElementById("gate-keep").checked, m = document.getElementById("gate-msg");
      m.textContent = "正在解锁……";
      var key;
      derive(pass).then(function(k){ key = k; return decryptWith(k); }).then(function(data){
        if (keep) crypto.subtle.exportKey("raw", key).then(function(raw){ try { localStorage.setItem(LSK, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch(err) {} });
        startApp(data);
      }).catch(function(){ m.textContent = "口令不对，请再试一次。"; });
    });
  }
  if (!window.crypto || !crypto.subtle) { view.innerHTML = '<p class="empty">这个浏览器不支持解密，请换用最新的 Safari 或 Chrome。</p>'; return; }
  var saved = null; try { saved = localStorage.getItem(LSK); } catch(e) {}
  if (!saved) { showGate(); return; }
  importRaw(b64(saved)).then(decryptWith).then(startApp).catch(function(){ try { localStorage.removeItem(LSK); } catch(e) {} showGate("内容已更新口令，请重新输入。"); });
})();
